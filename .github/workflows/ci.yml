name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  application:
    name: Application (lint et tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  dockerfile:
    name: Dockerfile (hadolint et build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: app/Dockerfile
      - run: docker build -t api-commandes:ci app/

  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  compose:
    name: Compose (syntaxe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cp .env.example .env
      - run: docker compose config -q

  prometheus:
    name: Prometheus (promtool)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Vérifier la configuration et les règles
        run: >
          docker run --rm -v "$PWD/prometheus:/etc/prometheus:ro"
          --entrypoint promtool prom/prometheus:v3.13.5
          check config /etc/prometheus/prometheus.yml
      - name: Tests unitaires des règles SLO
        run: >
          docker run --rm -v "$PWD/prometheus:/p:ro" -w /p/tests
          --entrypoint promtool prom/prometheus:v3.13.5
          test rules slo-test.yml

  alloy:
    name: Alloy (validation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: >
          docker run --rm -v "$PWD/alloy:/etc/alloy:ro"
          grafana/alloy:v1.22.0 fmt /etc/alloy/config.alloy
