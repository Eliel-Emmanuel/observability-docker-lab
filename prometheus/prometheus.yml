global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          service: prometheus
          env: lab

  - job_name: api-commandes
    static_configs:
      - targets: ["api-commandes:8000"]
        labels:
          service: api-commandes
          env: lab

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          service: node-exporter
          env: lab

  - job_name: blackbox-api
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://api-commandes:8000/sante"]
        labels:
          service: api-commandes
          env: lab
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
