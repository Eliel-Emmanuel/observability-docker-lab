global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          service: prometheus
          env: lab

  - job_name: api-commandes
    static_configs:
      - targets: ["api-commandes:8000"]
        labels:
          service: api-commandes
          env: lab
